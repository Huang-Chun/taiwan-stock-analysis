<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>產業地圖 - 台股供應鏈研究系統</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --border: #30363d; --text: #e6edf3; --muted: #8b949e;
  --green: #3fb950; --red: #f85149; --yellow: #e3b341;
  --blue: #58a6ff; --purple: #bc8cff; --radius: 8px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif; font-size: 14px; }

.topbar { display:flex; align-items:center; gap:16px; padding:10px 20px; background:var(--bg2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.topbar a { color:var(--blue); text-decoration:none; font-size:13px; font-weight:600; }
.topbar .title { font-weight:700; font-size:15px; }
.topbar nav { margin-left:auto; display:flex; gap:14px; }
.topbar nav a { color:var(--muted); font-weight:400; }
.topbar nav a:hover { color:var(--text); }

.layout { display:flex; min-height:calc(100vh - 45px); }

.sidebar { width:220px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border); padding:14px 10px; }
.sidebar-title { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; padding:0 6px 8px; }
.industry-item { padding:8px 10px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--text); margin-bottom:2px; }
.industry-item:hover { background:var(--bg3); }
.industry-item.active { background:rgba(88,166,255,0.15); color:var(--blue); }
.btn-new { width:100%; margin-top:10px; padding:8px; border-radius:6px; background:var(--bg3); border:1px solid var(--border); color:var(--text); cursor:pointer; font-size:12px; }
.btn-new:hover { border-color:var(--blue); }

.main { flex:1; padding:24px 32px 80px; max-width:980px; }
.empty { color:var(--muted); padding:40px; text-align:center; }

.im-header { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
.im-header h1 { font-size:22px; font-weight:700; flex:1; }
.im-header input.name { font-size:22px; font-weight:700; background:none; border:none; color:var(--text); border-bottom:1px solid var(--border); padding:2px 0; flex:1; }
.im-header input.name:focus { outline:none; border-bottom-color:var(--blue); }
.btn-toggle { background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; white-space:nowrap; }
.btn-toggle:hover { border-color:var(--blue); }
.btn-delete-map { background:none; border:1px solid var(--red); color:var(--red); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; white-space:nowrap; }
.btn-delete-map:hover { background:rgba(248,81,73,0.1); }

.card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:20px; }
.card.focus { border-color:var(--yellow); background:rgba(227,179,65,0.06); }
.card-title { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.card-title .hint { font-weight:400; text-transform:none; letter-spacing:0; color:#5a6a7a; font-size:11px; }

textarea, input[type=text] { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:8px 10px; font-size:13px; font-family:inherit; resize:vertical; }
textarea:focus, input[type=text]:focus { outline:none; border-color:var(--blue); }

.btn-save { background:var(--blue); border:none; color:#fff; border-radius:6px; padding:6px 14px; font-size:12px; cursor:pointer; margin-top:10px; }
.btn-save:hover { opacity:.9; }
.btn-save.small { padding:4px 10px; margin-top:6px; }
.save-ok { color:var(--green); font-size:12px; margin-left:8px; }

/* read-mode content (rendered markdown) */
.field-value { line-height:1.8; color:var(--text); font-size:14px; }
.field-value.empty { color:#4a5a6a; font-style:italic; white-space:pre-wrap; }
.field-value h1, .field-value h2, .field-value h3 { font-weight:700; }
.field-value h1 { font-size:19px; color:var(--blue); border-bottom:2px solid var(--blue); padding-bottom:6px; margin:18px 0 10px; }
.field-value h2 { font-size:16px; color:var(--yellow); border-left:3px solid var(--yellow); padding-left:10px; margin:18px 0 10px; }
.field-value h3 { font-size:14px; color:var(--purple); margin:14px 0 6px; }
.field-value h1:first-child, .field-value h2:first-child, .field-value h3:first-child { margin-top:2px; }
.field-value p { margin-bottom:10px; }
.field-value ul, .field-value ol { padding-left:20px; margin-bottom:10px; }
.field-value li { margin-bottom:5px; line-height:1.7; }
.field-value strong { color:var(--yellow); font-weight:700; }
.field-value em { color:var(--muted); }
.field-value code { background:var(--bg3); padding:1px 6px; border-radius:4px; font-size:12.5px; font-family:Consolas,'Courier New',monospace; color:#e06c75; }
.field-value hr { border:none; border-top:1px solid var(--border); margin:14px 0; }

table.rtable { width:100%; border-collapse:collapse; }
table.rtable th { text-align:left; font-size:11px; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--border); }
table.rtable td { padding:8px; border-bottom:1px solid var(--border); vertical-align:top; line-height:1.6; }
table.rtable td.layer-name { font-weight:600; white-space:nowrap; color:var(--blue); }
table.rtable td.dim { color:#4a5a6a; font-style:italic; }
table.rtable input { font-size:12px; padding:5px 7px; }

.btn-row-remove { background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; }
.btn-add-row { background:none; border:1px dashed var(--border); color:var(--muted); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; margin-right:8px; }
.btn-add-row:hover { border-color:var(--blue); color:var(--blue); }

.gap-list { list-style:none; }
.gap-list li { padding:4px 0 4px 22px; position:relative; line-height:1.6; }
.gap-list li::before { content:'☐'; position:absolute; left:0; color:var(--yellow); }

/* 覆蓋股票清單：每一列連到該股票自己的頁面 */
.company-card { display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--bg3); text-decoration:none; color:inherit; }
.company-card:hover { background:#262c36; border-color:var(--blue); }
.stock-tag { font-family:monospace; font-size:12px; color:var(--muted); }
.company-card .cname { font-weight:600; }
.badge { font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(88,166,255,0.12); color:var(--blue); }
.badge.judgment { background:rgba(227,179,65,0.12); color:var(--yellow); }
.badge.muted { background:var(--bg2); color:#4a5a6a; }
.expand-icon { margin-left:auto; color:var(--muted); font-size:11px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/">← 台股供應鏈研究系統</a>
  <span class="title">產業地圖</span>
  <nav>
    <a href="/dashboard.html">觀察總覽</a>
    <a href="/sectors.html">產業分類</a>
    <a href="/api.html">API</a>
  </nav>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">產業地圖</div>
    <div id="industryList"></div>
    <button class="btn-new" onclick="createIndustry()">+ 新增產業</button>
  </div>

  <div class="main" id="main">
    <div class="empty">選擇左側產業，或新增一個</div>
  </div>
</div>

<script>
const CHAIN_LAYERS = ['原材料','關鍵材料','零組件製造','模組整合','終端產品'];
const FOCUS_LAYERS = ['設備']; // 橫向跨層項目，不算材料流序列，獨立區塊呈現
const LAYERS = [...FOCUS_LAYERS, ...CHAIN_LAYERS];

let industries = [];
let current = null;   // full loaded industry map object
let viewMode = true;  // true = 檢視, false = 編輯

function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fieldValue(text) {
  const t = (text ?? '').toString().trim();
  return t ? `<div class="field-value">${marked.parse(t)}</div>` : `<div class="field-value empty">尚未填寫</div>`;
}

/* ─── Sidebar / industry list ─── */
async function loadIndustryList() {
  const r = await fetch('/api/industries');
  const j = await r.json();
  industries = j.success ? j.data : [];
  renderList();
}

function renderList() {
  const el = document.getElementById('industryList');
  el.innerHTML = industries.map(i =>
    `<div class="industry-item ${current && current.id === i.id ? 'active' : ''}" onclick="selectIndustry(${i.id})">${esc(i.name)}</div>`
  ).join('') || '<div style="color:var(--muted);font-size:12px;padding:8px 6px;">尚無產業地圖</div>';
}

async function createIndustry() {
  const name = prompt('新產業地圖名稱？');
  if (!name) return;
  const r = await fetch('/api/industries', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const j = await r.json();
  if (!j.success) return alert(j.error || '建立失敗');
  await loadIndustryList();
  selectIndustry(j.id);
}

async function selectIndustry(id) {
  const r = await fetch(`/api/industries/${id}`);
  const j = await r.json();
  if (!j.success) return alert(j.error || '載入失敗');
  current = j.data;
  viewMode = true;
  history.replaceState(null, '', `industry.html?id=${id}`);
  renderList();
  renderMain();
}

async function deleteIndustry() {
  if (!current) return;
  if (!confirm(`刪除產業地圖「${current.name}」？個股框架資料會保留但取消關聯。`)) return;
  await fetch(`/api/industries/${current.id}`, { method: 'DELETE' });
  current = null;
  await loadIndustryList();
  document.getElementById('main').innerHTML = '<div class="empty">選擇左側產業，或新增一個</div>';
}

function toggleViewMode() {
  viewMode = !viewMode;
  renderMain();
}

function flash(btn) {
  const ok = document.createElement('span');
  ok.className = 'save-ok';
  ok.textContent = '✓ 已儲存';
  btn.after(ok);
  setTimeout(() => ok.remove(), 1500);
}

/* ─── Basic field save (industry level) ─── */
async function saveBasicField(field, btn) {
  const val = document.getElementById('f_' + field).value;
  await fetch(`/api/industries/${current.id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: current.name,
      tech_background_notes: field === 'tech_background_notes' ? val : current.tech_background_notes,
      taiwan_participation_notes: field === 'taiwan_participation_notes' ? val : current.taiwan_participation_notes,
      customer_relationship_notes: field === 'customer_relationship_notes' ? val : current.customer_relationship_notes,
      open_gaps: field === 'open_gaps' ? val : current.open_gaps,
    })
  });
  current[field] = val;
  flash(btn);
}

async function saveName() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) return;
  await fetch(`/api/industries/${current.id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...current, name })
  });
  current.name = name;
  await loadIndustryList();
  renderList();
}

/* ─── Layers ─── */
async function saveLayers(btn) {
  const layers = LAYERS.map(layer => ({
    layer,
    players: document.getElementById('lp_' + layer).value,
    scarcity_source: document.getElementById('ls_' + layer).value,
    moat_level: document.getElementById('lm_' + layer).value,
    key_structure: document.getElementById('lk_' + layer).value,
  }));
  await fetch(`/api/industries/${current.id}/layers`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ layers })
  });
  current.layers = layers;
  flash(btn);
}

/* ─── Terms ─── */
let termRows = [];
function addTermRow() { termRows.push({ term: '', definition: '' }); renderTermsTable(); }
function removeTermRow(i) { termRows.splice(i, 1); renderTermsTable(); }
function renderTermsTable() {
  const body = document.getElementById('termsBody');
  if (!body) return;
  body.innerHTML = termRows.map((t, i) => `
    <tr>
      <td style="width:180px"><input type="text" value="${esc(t.term)}" onchange="termRows[${i}].term=this.value" placeholder="術語"></td>
      <td><input type="text" value="${esc(t.definition)}" onchange="termRows[${i}].definition=this.value" placeholder="定義"></td>
      <td><button class="btn-row-remove" onclick="removeTermRow(${i})">✕</button></td>
    </tr>
  `).join('');
}
async function saveTerms(btn) {
  await fetch(`/api/industries/${current.id}/terms`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ terms: termRows })
  });
  current.terms = termRows.map((t, i) => ({ ...t, sort_order: i }));
  flash(btn);
}

/* ─── 產品×應用總覽：唯讀彙總表，資料來源是各覆蓋股票自己頁面填的 matrix_cells，這裡不能編輯 ─── */
function matrixReadOnlyCard() {
  const matrix = current.matrix || [];
  const nameOf = (id) => (current.companies || []).find(c => c.stock_id === id)?.stock_name || '';
  return `
    <div class="card">
      <div class="card-title">4. 產品 × 應用總覽 <span class="hint">彙總自各覆蓋股票自己的頁面，此處唯讀；要新增/修改請到該股票頁面</span></div>
      ${matrix.length ? `<table class="rtable"><tr><th>股號</th><th>產品線</th><th>應用</th><th>備註</th></tr>
        ${matrix.map(m => `<tr><td><a href="stock.html?id=${esc(m.stock_id)}">${esc(m.stock_id)} ${esc(nameOf(m.stock_id))}</a></td><td>${esc(m.product_line)}</td><td>${esc(m.application)}</td><td>${esc(m.note)}</td></tr>`).join('')}
      </table>` : fieldValue(null)}
    </div>`;
}

/* ─── Render: EDIT MODE ─── */
function layerEditRow(layer) {
  const existing = (current.layers || []).find(l => l.layer === layer) || {};
  return `
    <tr>
      <td class="layer-name">${layer}</td>
      <td><input type="text" id="lp_${layer}" value="${esc(existing.players)}" placeholder="主要玩家（台廠標*）"></td>
      <td><input type="text" id="ls_${layer}" value="${esc(existing.scarcity_source)}" placeholder="稀缺性來源"></td>
      <td><input type="text" id="lm_${layer}" value="${esc(existing.moat_level)}" placeholder="護城河等級"></td>
      <td><input type="text" id="lk_${layer}" value="${esc(existing.key_structure)}" placeholder="關鍵結構"></td>
    </tr>`;
}
function renderEditView() {
  termRows = (current.terms || []).map(t => ({ ...t }));

  return `
    <div class="card focus">
      <div class="card-title">★ 特別關注（跨層） <span class="hint">不屬於材料流序列，是你想優先盯著看的橫向瓶頸/稀缺性</span></div>
      <table class="rtable">
        <tr><th>項目</th><th>主要玩家</th><th>稀缺性來源</th><th>護城河等級</th><th>關鍵結構</th></tr>
        ${FOCUS_LAYERS.map(layerEditRow).join('')}
      </table>
      <button class="btn-save" onclick="saveLayers(this)">儲存</button>
    </div>

    <div class="card">
      <div class="card-title">0. 前置技術背景 <span class="hint">容易混淆的技術概念先在此釐清</span></div>
      <textarea id="f_tech_background_notes" rows="3">${esc(current.tech_background_notes)}</textarea>
      <button class="btn-save" onclick="saveBasicField('tech_background_notes', this)">儲存</button>
    </div>

    <div class="card">
      <div class="card-title">1. 供應鏈地圖（材料流五層）</div>
      <table class="rtable">
        <tr><th>層別</th><th>主要玩家</th><th>稀缺性來源</th><th>護城河等級</th><th>關鍵結構</th></tr>
        ${CHAIN_LAYERS.map(layerEditRow).join('')}
      </table>
      <button class="btn-save" onclick="saveLayers(this)">儲存五層地圖</button>
    </div>

    <div class="card">
      <div class="card-title">2. 名詞解釋 <span class="hint">避免後面表格出現名詞混用</span></div>
      <table class="rtable"><tbody id="termsBody"></tbody></table>
      <button class="btn-add-row" onclick="addTermRow()">+ 新增術語</button>
      <button class="btn-save" onclick="saveTerms(this)">儲存名詞解釋</button>
    </div>

    <div class="card">
      <div class="card-title">3. 台灣參與度總覽 <span class="hint">哪些台廠在哪一層、全球份額估計、與國際大廠的關係型態</span></div>
      <textarea id="f_taiwan_participation_notes" rows="4">${esc(current.taiwan_participation_notes)}</textarea>
      <button class="btn-save" onclick="saveBasicField('taiwan_participation_notes', this)">儲存</button>
    </div>

    ${matrixReadOnlyCard()}

    <div class="card">
      <div class="card-title">5. 待確認事項 <span class="hint">明確列出未確認的資訊，不要用假設填補</span></div>
      <textarea id="f_open_gaps" rows="3" placeholder="每行一項，例如：- 供應商身分未確認">${esc(current.open_gaps)}</textarea>
      <button class="btn-save" onclick="saveBasicField('open_gaps', this)">儲存</button>
    </div>
  `;
}

/* ─── Render: READ MODE ─── */
function layerReadRow(layer) {
  const l = (current.layers || []).find(x => x.layer === layer) || {};
  const has = l.players || l.scarcity_source || l.moat_level || l.key_structure;
  return `
    <tr>
      <td class="layer-name">${layer}</td>
      <td class="${l.players ? '' : 'dim'}">${l.players ? esc(l.players) : '—'}</td>
      <td class="${l.scarcity_source ? '' : 'dim'}">${l.scarcity_source ? esc(l.scarcity_source) : '—'}</td>
      <td class="${l.moat_level ? '' : 'dim'}">${l.moat_level ? esc(l.moat_level) : '—'}</td>
      <td class="${l.key_structure ? '' : 'dim'}">${l.key_structure ? esc(l.key_structure) : '—'}</td>
    </tr>`;
}
function renderReadView() {
  const layers = current.layers || [];
  const terms = current.terms || [];
  const gapsLines = (current.open_gaps || '').split('\n').map(s => s.trim()).filter(Boolean);

  return `
    <div class="card focus">
      <div class="card-title">★ 特別關注（跨層） <span class="hint">不屬於材料流序列，是你想優先盯著看的橫向瓶頸/稀缺性</span></div>
      <table class="rtable">
        <tr><th>項目</th><th>主要玩家</th><th>稀缺性來源</th><th>護城河等級</th><th>關鍵結構</th></tr>
        ${FOCUS_LAYERS.map(layerReadRow).join('')}
      </table>
    </div>

    <div class="card">
      <div class="card-title">0. 前置技術背景</div>
      ${fieldValue(current.tech_background_notes)}
    </div>

    <div class="card">
      <div class="card-title">1. 供應鏈地圖（材料流五層）</div>
      <table class="rtable">
        <tr><th>層別</th><th>主要玩家</th><th>稀缺性來源</th><th>護城河等級</th><th>關鍵結構</th></tr>
        ${CHAIN_LAYERS.map(layerReadRow).join('')}
      </table>
    </div>

    <div class="card">
      <div class="card-title">2. 名詞解釋</div>
      ${terms.length ? `<table class="rtable">${terms.map(t => `<tr><td style="width:160px;font-weight:600;">${esc(t.term)}</td><td>${esc(t.definition)}</td></tr>`).join('')}</table>` : fieldValue(null)}
    </div>

    <div class="card">
      <div class="card-title">3. 台灣參與度總覽</div>
      ${fieldValue(current.taiwan_participation_notes)}
    </div>

    ${matrixReadOnlyCard()}

    <div class="card">
      <div class="card-title">5. 待確認事項</div>
      ${gapsLines.length ? `<ul class="gap-list">${gapsLines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : fieldValue(null)}
    </div>
  `;
}

/* ─── 覆蓋股票：只列清單，個股詳細內容(護城河/因果線/假設/驗證清單/事件)都在各自的 stock.html 頁面編輯 ─── */
function judgmentBadge(v) {
  return v ? `<span class="badge judgment">${esc(v)}</span>` : `<span class="badge muted">尚無判斷</span>`;
}

async function addCoverageStock() {
  const stockId = prompt('新增股票代號（會加入此產業的覆蓋清單，並開啟該股票的頁面）：');
  if (!stockId) return;
  const r = await fetch(`/api/stocks/${stockId}/profile`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ industry_map_id: current.id, is_coverage_active: true })
  });
  const j = await r.json();
  if (!j.success) return alert(j.error || '新增失敗');
  location.href = `stock.html?id=${encodeURIComponent(stockId)}`;
}

function renderCompanies() {
  const el = document.getElementById('companiesList');
  if (!el) return;
  const companies = current.companies || [];
  el.innerHTML = companies.map(c => `
    <a class="company-card" href="stock.html?id=${esc(c.stock_id)}">
      <span class="stock-tag">${esc(c.stock_id)}</span>
      <span class="cname">${esc(c.stock_name)}</span>
      ${c.layer ? `<span class="badge">${esc(c.layer)}</span>` : ''}
      ${judgmentBadge(c.v1_judgment)}
      <span class="expand-icon">開啟頁面 →</span>
    </a>`).join('') || '<div style="color:var(--muted);font-size:12px;">此產業尚無覆蓋股票</div>';
}

/* ─── Main render ─── */
function renderMain() {
  document.getElementById('main').innerHTML = `
    <div class="im-header">
      ${viewMode
        ? `<h1>${esc(current.name)}</h1>`
        : `<input type="text" class="name" id="f_name" value="${esc(current.name)}" onblur="saveName()">`
      }
      <button class="btn-toggle" onclick="toggleViewMode()">${viewMode ? '✎ 編輯模式' : '👁 檢視模式'}</button>
      <button class="btn-delete-map" onclick="deleteIndustry()">刪除產業地圖</button>
    </div>

    ${viewMode ? renderReadView() : renderEditView()}

    <div class="card">
      <div class="card-title">6. 覆蓋股票 <span class="hint">護城河/因果線/可證偽假設/驗證清單/事件日誌都在各自的股票頁面</span></div>
      <div id="companiesList"></div>
      <button class="btn-add-row" onclick="addCoverageStock()">+ 加入覆蓋股票</button>
    </div>
  `;
  renderCompanies();
}

(async function init() {
  await loadIndustryList();
  const id = new URLSearchParams(location.search).get('id');
  if (id) selectIndustry(parseInt(id));
})();
</script>
</body>
</html>
